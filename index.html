/* ---------- data ---------- */
/* 마지막으로 받은 데이터를 이 브라우저에 저장해 두고, 다음 방문 때 먼저 그려줌 (나만 보기 항목은 저장 안 함) */
const CK = 'rosie-cache-v1';
let cacheSig = '';
function fromCache(){
  try{ const raw = localStorage.getItem(CK); if(!raw) return false; const d = JSON.parse(raw);
    CH = d.c.filter(canSee); PR = d.p.filter(canSee); OC = d.o.filter(canSee); SET = d.s || {}; cacheSig = raw; return true; }catch(_){ return false; }
}
async function load(pre, early){
  const q = t => Promise.resolve(sb.from(t).select('*').order(t === 'site_settings' ? 'key' : 'id'));
  const qo = q('ooc'), qs = q('site_settings');
  /* OOC 화면은 캐릭터/프롬프트를 안 쓰니까 OOC랑 설정만 오면 먼저 그림 */
  if(early) Promise.all([qo, qs, pre]).then(([o, st]) => early(o, st), () => {});
  const [c, p, o, st2] = await Promise.all([q('characters'), q('prompts'), qo, qs, pre]);
  if(c.error || p.error){ if(!CH.length && !PR.length) app.innerHTML = `<p class="empty">불러오기 실패<br>${esc((c.error||p.error).message)}</p>`; return false; }
  const od = o.error ? [] : o.data;
  CH = c.data.filter(canSee); PR = p.data.filter(canSee); OC = od.filter(canSee);
  if(!st2.error) SET = Object.fromEntries(st2.data.map(r => [r.key, r.value]));
  fillOocKeys();
  const pub = a => a.filter(r => vis(r) !== 'private');
  try{ const raw = JSON.stringify({ c: pub(c.data), p: pub(p.data), o: pub(od), s: SET }); const same = raw === cacheSig; cacheSig = raw; localStorage.setItem(CK, raw); if(same) return 'same'; }catch(_){}
  return true;
}
const textOf = k => {
  if(k==='z') return pcUrl();
  if(k[0]==='l'){ const o = OC.find(x => x.id===+k.slice(1)); return o ? shareUrl('ooc', o) : ''; }
  if(k[0]==='u'){ const p = PR.find(x => x.id===+k.slice(1)); return p ? shareUrl('prompts', p) : ''; }
  if(k[0]==='k'){ const c = CH.find(x => x.id===+k.slice(1)); return c ? shareUrl('c', c) : ''; }
  if(k[0]==='g'){ const o = OC.find(o => o.id===+k.slice(1)); return o ? ocText(o) : ''; }
  if(k[0]==='q'){ const [i,j] = k.slice(1).split('-'); const p = PR.find(p => p.id===+i); return ((p && p.subs || [])[+j] || {}).x; }
  if(k[0]==='s'){ const [i,j] = k.slice(1).split('-'); const c = CH.find(c => c.id===+i); return ((c && c.subs || [])[+j] || {}).x; }
  if(k[0]==='o') return (CH.find(c => c.id===+k.slice(1))||{}).outfit;
  return k[0]==='p' ? (PR.find(p => p.id===+k.slice(1))||{}).text : (CH.find(c => c.id===+k.slice(1))||{}).prompt;
};
/* 링크로만 공개: 목록/메인/검색/개수에는 관리자에게만, 개별 링크로는 누구나 */

const ocTags = s => String(s ?? '').split(/[,，#]+/).map(x => x.trim()).filter(Boolean);
const is18 = t => /^[RG]-?18$/i.test(t);
/* 태그 순서: site_settings.ooc_tags(JSON). 저장된 순서 먼저, 새 태그는 뒤에 */
let OTO = false;
const ocOrder = () => { try{ const a = JSON.parse(SET.ooc_tags || '[]'); return Array.isArray(a) ? a : []; }catch(_){ return []; } };
const ocAll = () => { const seen = [...new Set(LO().flatMap(o => ocTags(o.tags)))], ord = ocOrder(); return [...ord.filter(t => seen.includes(t)), ...seen.filter(t => !ord.includes(t))]; };
let OCA = null;

async function upload(file, dir){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*s); cv.height = Math.round(bmp.height*s);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/webp', .88));
  const path = `${dir}/${crypto.randomUUID()}.webp`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/webp', cacheControl:'31536000' });
  if(error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

const parseInfo = t => {
  const out = [];
  t.split('\n').forEach(raw => {
    const l = raw.trim(); if(!l) return;
    const m = l.match(/^([^:：]+)[:：]\s*(.*)$/);
    if(m) out.push([m[1].trim(), m[2].trim()]);
    else if(out.length) out[out.length-1][1] += '\n' + l;
  });
  return out.filter(([k,v]) => k && v);
};

const rrHtml = (o, t, uid) => { const src = (o && o.img) || t.img || '', pos = (o && o.pos) || (o && o.img ? '50% 50%' : t.img_pos) || '50% 50%', z = (o && o.z) || ((o && o.img) ? 1 : zOf(t.img_pos));

function bindRow(r){
  const rb = r.querySelector('.rb'), box = r.querySelector('.pe'), file = r.querySelector('.rf'), hid = r.querySelector('.rp'), rz = r.querySelector('.rz');
  let im = box.querySelector('img'); if(!im){ im = document.createElement('img'); im.alt = ''; box.appendChild(im); }
  let pos = String(hid.value).split(' ').map(parseFloat); if(pos.length < 2 || pos.some(isNaN)) pos = [50, 50];
  let z = parseFloat(rz.value) || 1;
  const apply = () => { const o = `${pos[0].toFixed(1)}% ${pos[1].toFixed(1)}%`; im.style.objectPosition = o; im.style.transformOrigin = o; im.style.transform = `scale(${z})`; hid.value = o; };
  apply();
  file.addEventListener('change', () => { const f = file.files[0]; if(f){ im.src = URL.createObjectURL(f); pos = [50, 50]; z = 1; rz.value = 1; apply(); } });
  rz.oninput = () => { z = parseFloat(rz.value) || 1; apply(); dirty = true; };
  box.addEventListener('wheel', e => { e.preventDefault(); z = Math.max(1, Math.min(3, z - e.deltaY * 0.002)); rz.value = z; apply(); dirty = true; }, { passive:false });
  let d = null;
  box.addEventListener('pointerdown', e => { d = { x:e.clientX, y:e.clientY, p:[...pos] }; box.setPointerCapture(e.pointerId); });
  box.addEventListener('pointermove', e => {
    if(!d || !im.naturalWidth) return;
    const bb = box.getBoundingClientRect(), sc = Math.max(bb.width / im.naturalWidth, bb.height / im.naturalHeight);
    const gx = z * (im.naturalWidth * sc - bb.width) + (z - 1) * bb.width, gy = z * (im.naturalHeight * sc - bb.height) + (z - 1) * bb.height, cl = v => Math.max(0, Math.min(100, v));
    if(gx > 1) pos[0] = cl(d.p[0] - (e.clientX - d.x) / gx * 100);
    if(gy > 1) pos[1] = cl(d.p[1] - (e.clientY - d.y) / gy * 100);
    apply(); dirty = true;
  });
  const end = () => { d = null; };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
}
async function readRel(){

    const pp = r.querySelector('.rp').value, zz = parseFloat(r.querySelector('.rz').value) || 1; if(zz > 1.001) o.z = +zz.toFixed(2);

    out.push(o);
  }

}

function initPos(src0, pos0, hn = 'img_pos', fn = 'file'){
  const boxes = [...document.querySelectorAll('#pe-wrap .pe')], ims = boxes.map(b => b.querySelector('img')), wrap = $('#pe-wrap'), hid = $('#f [name=' + hn + ']'), file = $('#f [name=' + fn + ']');
  const tk = String(pos0 || '50% 50%').split(' ').map(parseFloat);
  let pos = tk.length < 2 || isNaN(tk[0]) || isNaN(tk[1]) ? [50, 50] : [tk[0], tk[1]];
  let z = tk[2] > 1 && tk[2] <= 3 ? tk[2] : 1;
  let blob = '';
  const zr = document.createElement('div');
  zr.innerHTML = '<div style="font-size:11px;color:var(--mut);margin-top:8px">확대 · 슬라이더 / 마우스 휠</div><input type="range" class="pz" min="1" max="3" step="0.05" style="width:100%;max-width:240px;padding:0;margin-top:4px">';
  wrap.appendChild(zr);
  const zs = zr.querySelector('.pz'); zs.value = z;
  const apply = () => {
    const o = `${pos[0].toFixed(1)}% ${pos[1].toFixed(1)}%`;
    ims.forEach(im => { im.style.objectPosition = o; im.style.transformOrigin = o; im.style.transform = z > 1.001 ? `scale(${z})` : ''; });
    hid.value = o + (z > 1.001 ? ' ' + z.toFixed(2) : '');
  };
  const show = src => { if(src){ ims.forEach(im => { im.src = src; }); wrap.hidden = false; } else wrap.hidden = true; };
  show(src0); apply();
  file.addEventListener('change', () => {
    const f = file.files[0];
    if(blob) URL.revokeObjectURL(blob);
    if(f){ blob = URL.createObjectURL(f); pos = [50, 50]; z = 1; zs.value = 1; show(blob); apply(); } else { blob = ''; show(src0); }
  });
  zs.addEventListener('input', () => { z = parseFloat(zs.value) || 1; apply(); dirty = true; });
  boxes.forEach((box, bi) => {
    const im = ims[bi]; let d = null;
    box.addEventListener('wheel', e => { e.preventDefault(); z = Math.max(1, Math.min(3, z - e.deltaY * 0.002)); zs.value = z; apply(); dirty = true; }, { passive:false });
    box.addEventListener('pointerdown', e => { d = { x:e.clientX, y:e.clientY, p:[...pos] }; box.setPointerCapture(e.pointerId); });
    box.addEventListener('pointermove', e => {
      if(!d || !im.naturalWidth) return;
      const r = box.getBoundingClientRect(), sc = Math.max(r.width / im.naturalWidth, r.height / im.naturalHeight);
      const gx = z * (im.naturalWidth * sc - r.width) + (z - 1) * r.width, gy = z * (im.naturalHeight * sc - r.height) + (z - 1) * r.height, cl = v => Math.max(0, Math.min(100, v));
      if(gx > 1) pos[0] = cl(d.p[0] - (e.clientX - d.x) / gx * 100);
      if(gy > 1) pos[1] = cl(d.p[1] - (e.clientY - d.y) / gy * 100);
      apply(); dirty = true;
    });
    const end = () => { d = null; };
    box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  });
}

function copy(b){

  const done = () => { b.textContent = 'COPIED'; b.classList.add('done'); setTimeout(() => { b.innerHTML = o; b.classList.remove('done'); }, 1200); };
  const fb = () => { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); }catch(_){} a.remove(); done(); };
  (navigator.clipboard && window.isSecureContext) ? navigator.clipboard.writeText(t).then(done, fb) : fb();
}

  if(!ok){ err.textContent = '비밀번호가 맞지 않아요'; inp.select(); return; }
  UNL.add(k); try{ sessionStorage.setItem('unl', JSON.stringify([...UNL])); }catch(_){}
  const [a, b] = location.hash.slice(2).split('/');
  if(k[0]==='o' && $('#olist')){ drawOoc(); const row = document.querySelector(`#olist .oc-r[data-oid="${r.id}"]`); if(row) openRow(row); return; }
  if(a==='c') pageChar(b); else if($('#list')) list(); else route();
});
/* gallery: 관리자는 사진을 드래그해서 순서 조정 (놓으면 자동 저장) */
let gsorted = false;
document.addEventListener('click', e => { if(gsorted){ e.stopPropagation(); e.preventDefault(); gsorted = false; } }, true);

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = +b.dataset.id || null;
  if(a==='pin'){ e.preventDefault(); const c = CH.find(x => x.id===id); const r = await sb.from('characters').update({ pinned: !c.pinned }).eq('id', id); if(r.error) return alert('핀 실패: ' + r.error.message); await load(); return pageChars(); }
  if(a==='order'){ ORD = !ORD; return pageChars(); }
  if(a==='copy') return copy(b);
  if(a==='close') return closeM();
  if(a==='pc-new'){ if(!confirm('새 링크를 만들면 예전 링크로는 더 이상 persona가 안 보여요. 만들까요?')) return;
    const k = mkKey(), r = await sb.from('site_settings').upsert({ key: 'pc_key', value: k }); if(r.error) return alert('실패: ' + r.error.message);
    SET.pc_key = k; const i = b.closest('.pcl').querySelector('input'); i.value = pcUrl(); return; }
  if(a==='pick-tag'){ const box = b.closest('.tpk'), inp = pickInput(box), t = b.dataset.t, has = splitTags(inp.value);
    inp.value = (has.includes(t) ? has.filter(x => x !== t) : [...has, t]).join(', '); dirty = true; syncPick(box); return; }
  if(a==='edit-rel'){ e.preventDefault(); const c = CH.find(x => x.id===id); if(c) formRel(c, +b.dataset.rid || 0, b.dataset.uid || ''); return; }
  if(a==='del-rel'){ const c = CH.find(x => x.id===id), rid = +b.dataset.rid, uid = b.dataset.uid || ''; if(!c || !confirm('이 관련 캐릭터를 삭제할까요?')) return;
    const t = rid ? CH.find(x => x.id===rid) : null, ops = [sb.from('characters').update({ related: (c.related || []).filter(x => uid ? x.uid !== uid : x.id !== rid) }).eq('id', c.id)];
    if(t) ops.push(sb.from('characters').update({ related: (t.related || []).filter(x => x.id !== c.id) }).eq('id', t.id));
    const er = (await Promise.all(ops)).find(x => x.error); if(er) return alert('삭제 실패: ' + er.error.message);
    closeM(); await load(); route(); return; }
  if(a==='edit-gal'){ const c = CH.find(x => x.id===id); if(c) formGal(c); return; }
  if(a==='edit-sub'){ const c = CH.find(x => x.id===id); if(c) formSub(c, +b.dataset.i); return; }
  if(a==='del-one-sub'){ const c = CH.find(x => x.id===id); if(!c || !confirm('이 서브 프롬프트를 삭제할까요?')) return;
    const subs = (c.subs || []).filter((_, k) => k !== +b.dataset.i);
    const r = await sb.from('characters').update({ subs }).eq('id', c.id); if(r.error) return alert('삭제 실패: ' + r.error.message);
    closeM(); await load(); route(); return; }
  if(a==='expand'){ b.classList.toggle('open'); return; }
  if(a==='subv'){ SV = b.dataset.sv; try{ localStorage.setItem('sv', SV); }catch(_){} const sp = $('#sps'); if(sp) sp.dataset.v = SV; document.querySelectorAll('[data-act=subv]').forEach(x => x.classList.toggle('on', x===b)); return; }
  if(a==='zoom'){ const l = $('#lb'); l.innerHTML = `<img src="${esc(b.dataset.src)}">`; l.hidden = false; return; }
  if(a==='add-sub') return $('#subs').insertAdjacentHTML('beforeend', subRow({}, !!$('#subs').dataset.ph));
  if(a==='del-sub') return b.closest('.sr').remove();
  if(a==='otag-order'){ OTO = !OTO; return pageOoc(); }
  if(a==='swap-o'){ const k = +b.dataset.id, o = OC.find(x => x.id===k), r = b.closest('.oc-r'); if(!o) return;
    OSW.has(k) ? OSW.delete(k) : OSW.add(k);
    if(r){ const pv = r.querySelector('.oc-pv'); if(pv) pv.textContent = r.classList.contains('open') ? ocText(o) : ocText(o).slice(0, OCPV); }
    b.classList.toggle('on', OSW.has(k)); return; }
  if(a==='new-o') return formOoc();
  if(a==='edit-o') return formOoc(OC.find(o => o.id===id));
  if(a==='del-o') { if(await del('ooc', id, 'OOC')){ if(/^#\/ooc\/./.test(location.hash)) location.hash = '#/ooc'; else route(); } return; }
  if(a==='new-p') return formP();
  if(a==='edit-p') return formP(PR.find(p => p.id===id));
  if(a==='del-p') { if(await del('prompts', id, '프롬프트')){ if(/^#\/prompts\/./.test(location.hash)) location.hash = '#/prompts'; else route(); } return; }
  if(a==='new-c') return formC();
  if(a==='edit-c') return formC(CH.find(c => c.id===id));
  if(a==='del-c') { if(await del('characters', id, '캐릭터')) location.hash==='#/characters' ? route() : location.hash = '#/characters'; }
});
/* 이미지 저장 방지: 우클릭·꾹 누르기 메뉴·드래그 차단 (입력창/프롬프트 글자 영역은 복사·붙여넣기 메뉴 유지) */
document.addEventListener('contextmenu', e => { if(!e.target.closest('input,textarea,select,pre,.tx,[contenteditable]')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if(e.target.tagName==='IMG' || e.target.closest('img')) e.preventDefault(); });
$('#lb').onclick = () => { $('#lb').hidden = true; };
addEventListener('keydown', e => { if(e.key==='Escape'){ if(!$('#lb').hidden){ $('#lb').hidden = true; return; } if(!$('#md').hidden && (!dirty || confirm('입력한 내용이 사라져요. 닫을까요?'))) closeM(); } });
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
const isDark = () => { const r = document.documentElement; return r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; };
const paintTheme = () => { const d = isDark(), b = $('#theme'); b.innerHTML = d ? MOON : SUN; const t = d ? '라이트 모드로 전환' : '다크 모드로 전환'; b.setAttribute('aria-label', t); b.title = t; };
/* 기본은 기기(인터페이스) 테마를 따라감. 버튼으로 바꾼 건 기기 테마와 다를 때만 저장하고, 기기 테마가 바뀌면 다시 기기 쪽을 따라감 */
const sysDark = () => matchMedia('(prefers-color-scheme:dark)').matches;
const setTheme = t => { const r = document.documentElement;
  if(!t || (t==='dark') === sysDark()){ delete r.dataset.theme; try{ localStorage.removeItem('rosie-theme'); }catch(_){} }
  else { r.dataset.theme = t; try{ localStorage.setItem('rosie-theme', t); }catch(_){} }
  document.querySelectorAll('meta[name=theme-color]').forEach(m => { if(r.dataset.theme) m.content = r.dataset.theme==='dark' ? '#000000' : '#ffffff'; else m.content = /dark/.test(m.media) ? '#000000' : '#ffffff'; });
  paintTheme(); };
$('#theme').onclick = () => setTheme(isDark() ? 'light' : 'dark');
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => setTheme(null));
setTheme(document.documentElement.dataset.theme);
const syncAdm = () => { $('#adm').classList.toggle('on', admin); $('#set').hidden = !admin; };
const FEATS = [['pc','PERSONA 페이지'],['pp','PROMPT 페이지'],['cp','캐릭터 프롬프트'],['subs','서브 프롬프트'],['gal','갤러리'],['rel','관련 캐릭터'],['relp','관련 프롬프트'],['tags','태그'],['oo','OOC 페이지']];
function formSettings(){
  const opts = k => k === 'pc' ? [['on','공개'],['link','링크로 들어온 사람만'],['admin','나만 보기']] : [['on','공개'],['admin','나만 보기'],['off','끔']];
  const pcBox = () => SET.pc_key ? `<div class="pcl"><input readonly value="${esc(pcUrl())}" aria-label="PERSONA 비밀 링크"><button class="btn" type="button" data-act="copy" data-k="z">COPY</button><button class="btn" type="button" data-act="pc-new" title="새 링크를 만들면 예전 링크는 더 이상 안 돼요">NEW LINK</button></div>` : '<p class="hint">저장하면 비밀 링크가 만들어져요.</p>';
  openM(`<h3>SETTINGS</h3><form id="f">${FEATS.map(([k,l]) => `<label>${l}</label><select name="${k}"${k === 'pc' ? ' id="pcsel"' : ''}>${opts(k).map(([v,t]) => `<option value="${v}"${(SET[k]||'on')===v ? ' selected' : ''}>${t}</option>`).join('')}</select>${k === 'pc' ? `<div id="pcbox"${(SET.pc||'on') === 'link' ? '' : ' hidden'}>${pcBox()}<p class="hint">이 링크로 들어온 사람만, 그 탭을 닫기 전까지 메뉴에 persona가 보여요. 처음엔 메인 화면이 떠요.</p></div>` : ''}`).join('')}${btns('SAVE')}</form>`);
  $('#pcsel').onchange = e => { $('#pcbox').hidden = e.target.value !== 'link'; };
  $('#f').onsubmit = async e => { e.preventDefault(); const fd = new FormData(e.target); st('저장 중…');
    const rows = FEATS.map(([k]) => ({ key: k, value: fd.get(k) }));
    if(fd.get('pc') === 'link' && !SET.pc_key) rows.push({ key: 'pc_key', value: mkKey() });
    const r = await sb.from('site_settings').upsert(rows);
    if(r.error) return st('저장 실패: ' + r.error.message);
    rows.forEach(o => { SET[o.key] = o.value; }); closeM(); route(); };
}
$('#set').onclick = formSettings;
$('#adm').onclick = async () => { if(admin){ await sb.auth.signOut(); route(); } else formLogin(); };
sb.auth.onAuthStateChange((_ev, s) => { const was = admin; admin = !!s; syncAdm(); if(was !== admin && (CH.length || PR.length)){ CH = CH.filter(canSee); PR = PR.filter(canSee); route(); setTimeout(async () => { if(await load()) route(); }, 0); } });
addEventListener('hashchange', route);
/* 스크롤하는 동안에만 보이는 얇은 막대 (페이지·카드 안 어디서든) */
const SB = document.createElement('div'); SB.id = 'sbar'; SB.setAttribute('aria-hidden', 'true'); document.body.appendChild(SB);
let sbT = 0;
document.addEventListener('scroll', e => {
  const root = e.target === document || e.target === document.documentElement, t = root ? document.documentElement : e.target;
  if(!t || !t.getBoundingClientRect) return;
  const sh = t.scrollHeight, ch = root ? innerHeight : t.clientHeight; if(sh <= ch + 1) return;
  const r = root ? { top: 0, right: innerWidth, height: innerHeight } : t.getBoundingClientRect();
  const h = Math.max(24, r.height * ch / sh), y = r.top + (r.height - h) * (t.scrollTop / (sh - ch));
  SB.style.cssText = `top:${y}px;height:${h}px;left:${r.right - 3}px;right:auto`; SB.classList.add('on');
  clearTimeout(sbT); sbT = setTimeout(() => SB.classList.remove('on'), 800);
}, { capture: true, passive: true });

(async () => {
  const shown = fromCache();
  if(shown) route(); else app.innerHTML = '<p class="empty">LOADING…</p>';
  const sess = sb.auth.getSession().then(({ data }) => { admin = !!data.session; syncAdm(); });
  const onOoc = () => (location.hash.slice(2) || 'home').split('/')[0] === 'ooc';
  let early = false;
  const r = await load(sess, (o, st) => {
    if(shown) return;
    if(!st.error) SET = Object.fromEntries(st.data.map(x => [x.key, x.value]));
    if(!o.error) OC = o.data.filter(canSee);
    if(onOoc()){ early = true; route(); }
  });
  /* 저장해 둔 것과 같으면 다시 그리지 않음 (보던 화면/입력 유지). 관리자면 나만 보기 항목 때문에 항상 다시 그림.
     OOC를 먼저 그렸고 아직 OOC 화면이면 다시 그리지 않음 (검색/펼친 줄 유지) */
  if(r && !(early && onOoc()) && (r !== 'same' || !shown || admin)) route();
})();
</script>
