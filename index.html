<body>
<header><div class="wrap">
  <a class="logo" href="#/characters">r♡sie <span class="lg2">prompt</span></a>
  <nav>
    <a href="#/characters" id="n1">persona</a>

    <button class="tg2" id="theme" type="button" aria-label="테마 전환"></button>
  </nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap"><button id="adm" aria-label="관리자">♡︎</button>PERSONAL ARCHIVE · NO REDISTRIBUTION</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
const SUPABASE_URL = "https://sxnijnngeatcscwyxhep.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4bmlqbm5nZWF0Y3Njd3l4aGVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjE0MjIsImV4cCI6MjEwNzAzNzQyMn0.zT-jmsg7M14H7BFnqWFSclc6wnANJNDnHiVuCY9SoI8";
const BUCKET = "images";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(3, '0');
const okPos = p => /^\d+(\.\d+)?% \d+(\.\d+)?%( \d+(\.\d+)?)?$/.test(p || '') ? p : '';
const xyOf = p => String(okPos(p) || '50% 50%').split(' ').slice(0, 2).join(' ');
const zOf = p => { const z = parseFloat(String(okPos(p)).split(' ')[2]); return z > 1.001 && z <= 3 ? z : 1; };
const img = (src, alt, pos) => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy"${okPos(pos) ? ` style="object-position:${xyOf(pos)}${zOf(pos) > 1 ? `;transform-origin:${xyOf(pos)};transform:scale(${zOf(pos)})` : ''}"` : ''}>` : '';
const fullOf = c => ((c.info || []).find(([k]) => ['Alias','alias','ALIAS','별칭'].includes(k)) || [])[1] || '';
const sortCh = () => [...CH].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0) || (a.sort_order ?? 1e9) - (b.sort_order ?? 1e9) || a.id - b.id);
let ORD = false;
const initial = n => esc([...n][0] || '?');
let CH = [], PR = [], admin = false, dirty = false;
const tagsOf = s => String(s ?? '').split(/[,，#]+/).map(x => x.trim()).filter(Boolean);
let SV = 'a'; try{ SV = localStorage.getItem('sv') || 'a'; }catch(_){} if(!['a','c'].includes(SV)) SV = 'a';
function subBox(c, x, i, pre='s'){
  const t = x.t || 'SUB ' + (i+1);
  if(pre!=='s'){
    return `<div class="sb"><div class="hd"><span>${esc(t)}</span><button class="btn" data-act="copy" data-k="${pre}${c.id}-${i}">COPY</button></div><pre class="tx">${esc(x.x)}</pre></div>`;
  }
  const z = x.img ? ` data-act="zoom" data-src="${esc(x.img)}"` : '';
  return `<div class="sp" data-si="${i}"><div class="sim${x.img ? '' : ' no'}"${z}>${x.img ? img(x.img,t,x.pos) : initial(t)}</div>
  <div class="bd"><div class="hd"><span class="tt">${admin && (c.subs||[]).length > 1 ? '<span class="dh" title="끌어서 순서 변경">⠿</span>' : ''}<span>${esc(t)}</span></span><div>${admin ? `<button class="btn" data-act="edit-sub" data-id="${c.id}" data-i="${i}">EDIT</button>` : ''}<button class="btn" data-act="copy" data-k="${pre}${c.id}-${i}">COPY</button></div></div>
  <pre class="tx">${esc(x.x)}</pre></div></div>`;
}

/* ---------- data ---------- */
async function load(){
  const [c, p] = await Promise.all([sb.from('characters').select('*').order('id'), sb.from('prompts').select('*').order('id')]);
  if(c.error || p.error){ app.innerHTML = `<p class="empty">불러오기 실패<br>${esc((c.error||p.error).message)}</p>`; return false; }
  CH = c.data; PR = p.data; return true;
}
const textOf = k => {
  if(k[0]==='q'){ const [i,j] = k.slice(1).split('-'); const p = PR.find(p => p.id===+i); return ((p && p.subs || [])[+j] || {}).x; }
  if(k[0]==='s'){ const [i,j] = k.slice(1).split('-'); const c = CH.find(c => c.id===+i); return ((c && c.subs || [])[+j] || {}).x; }
  if(k[0]==='o') return (CH.find(c => c.id===+k.slice(1))||{}).outfit;
  return k[0]==='p' ? (PR.find(p => p.id===+k.slice(1))||{}).text : (CH.find(c => c.id===+k.slice(1))||{}).prompt;
};
const num = p => PR.findIndex(x => x.id===p.id) + 1;
const chName = id => (CH.find(c => c.id===id)||{}).name;

/* ---------- views ---------- */
function promptBox(p){
  const cn = p.char_id ? chName(p.char_id) : '';
  return `<div class="pr">${p.img ? `<div class="im" data-act="zoom" data-src="${esc(p.img)}">${img(p.img,'',p.img_pos)}</div>` : ''}
  <div class="bd"><div class="hd"><span>#${num(p)} · ${esc(p.cat)}${cn ? ' · ' + esc(cn) : ''}</span>
  <div>${admin ? `<button class="btn" data-act="edit-p" data-id="${p.id}">EDIT</button><button class="btn" data-act="del-p" data-id="${p.id}">DEL</button>` : ''}<button class="btn" data-act="copy" data-k="p${p.id}">COPY</button></div></div>
  <pre class="tx">${esc(p.text)}</pre>${(p.subs||[]).map((x,i) => subBox(p,x,i,'q')).join('')}</div></div>`;
}

function pageChars(){

  ${admin ? `<div style="display:flex;gap:5px"><button class="btn ${ORD ? 'on' : ''}" data-act="order">${ORD ? 'DONE' : 'ORDER'}</button><button class="btn" data-act="new-c">+ NEW</button></div>` : ''}</div>

async function upload(file, dir){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*s); cv.height = Math.round(bmp.height*s);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/webp', .88));
  const path = `${dir}/${crypto.randomUUID()}.webp`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/webp', cacheControl:'31536000' });
  if(error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

const parseInfo = t => {
  const out = [];
  t.split('\n').forEach(raw => {
    const l = raw.trim(); if(!l) return;
    const m = l.match(/^([^:：]+)[:：]\s*(.*)$/);
    if(m) out.push([m[1].trim(), m[2].trim()]);
    else if(out.length) out[out.length-1][1] += '\n' + l;
  });
  return out.filter(([k,v]) => k && v);
};

function bindRow(r){
  const rb = r.querySelector('.rb'), box = r.querySelector('.pe'), file = r.querySelector('.rf'), hid = r.querySelector('.rp'), rz = r.querySelector('.rz');
  let im = box.querySelector('img'); if(!im){ im = document.createElement('img'); im.alt = ''; box.appendChild(im); }
  let pos = String(hid.value).split(' ').map(parseFloat); if(pos.length < 2 || pos.some(isNaN)) pos = [50, 50];
  let z = parseFloat(rz.value) || 1;
  const apply = () => { const o = `${pos[0].toFixed(1)}% ${pos[1].toFixed(1)}%`; im.style.objectPosition = o; im.style.transformOrigin = o; im.style.transform = `scale(${z})`; hid.value = o; };
  apply();
  file.addEventListener('change', () => { const f = file.files[0]; if(f){ im.src = URL.createObjectURL(f); pos = [50, 50]; z = 1; rz.value = 1; apply(); } });
  rz.oninput = () => { z = parseFloat(rz.value) || 1; apply(); dirty = true; };

async function readRel(){
  const rows = [...document.querySelectorAll('#rrw .rr')], out = [];

    const rx = r.querySelector('.rx'); if(rx && rx.checked) im = '';
    const f = r.querySelector('.rf').files[0]; if(f && f.size){ st(`관련 캐릭터 썸네일 업로드 중… ${i+1}/${rows.length}`); im = await upload(f, 'characters'); }
    const pp = r.querySelector('.rp').value, zz = parseFloat(r.querySelector('.rz').value) || 1; if(zz > 1.001) o.z = +zz.toFixed(2);

    out.push(o);

}

function initPos(src0, pos0, hn = 'img_pos', fn = 'file'){

  let blob = '';

  wrap.appendChild(zr);

    const o = `${pos[0].toFixed(1)}% ${pos[1].toFixed(1)}%`;

  show(src0); apply();
  file.addEventListener('change', () => {
    const f = file.files[0];
    if(blob) URL.revokeObjectURL(blob);
    if(f){ blob = URL.createObjectURL(f); pos = [50, 50]; z = 1; zs.value = 1; show(blob); apply(); } else { blob = ''; show(src0); }
  });
  zs.addEventListener('input', () => { z = parseFloat(zs.value) || 1; apply(); dirty = true; });
  boxes.forEach((box, bi) => {
    const im = ims[bi]; let d = null;
    box.addEventListener('wheel', e => { e.preventDefault(); z = Math.max(1, Math.min(3, z - e.deltaY * 0.002)); zs.value = z; apply(); dirty = true; }, { passive:false });
    box.addEventListener('pointerdown', e => { d = { x:e.clientX, y:e.clientY, p:[...pos] }; box.setPointerCapture(e.pointerId); });

      if(!d || !im.naturalWidth) return;
      const r = box.getBoundingClientRect(), sc = Math.max(r.width / im.naturalWidth, r.height / im.naturalHeight);
      const gx = z * (im.naturalWidth * sc - r.width) + (z - 1) * r.width, gy = z * (im.naturalHeight * sc - r.height) + (z - 1) * r.height, cl = v => Math.max(0, Math.min(100, v));
      if(gx > 1) pos[0] = cl(d.p[0] - (e.clientX - d.x) / gx * 100);
      if(gy > 1) pos[1] = cl(d.p[1] - (e.clientY - d.y) / gy * 100);
      apply(); dirty = true;
    });
    const end = () => { d = null; };
    box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  });
}

    document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); }catch(_){} a.remove(); done(); };

}
