<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>r♡sieprompt</title>
<link rel="icon" type="image/png" href="images/moai.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--mut:#9a9a9a;--line:#e4e4e4;--soft:#f6f6f6;--sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mut:#777;--line:#2a2a2a;--soft:#111}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mut:#777;--line:#2a2a2a;--soft:#111}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;letter-spacing:-0.03em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{letter-spacing:inherit;line-height:inherit}
a{color:inherit}
.wrap{max-width:1014px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:2px solid var(--fg);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:44px}
.logo{font-family:Pretendard,"Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-weight:600;font-size:16px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;white-space:pre}
.hrt{width:.95em;height:.95em;margin:0 .02em;fill:none;stroke:var(--fg);stroke-width:3.2;stroke-linejoin:round;transform:translateY(1px)}
.lg2{font-size:11px;font-weight:500;color:var(--mut)}
nav{display:flex;gap:2px;align-items:center}
nav a,.btn{font:600 11px/1.5 var(--sans);text-decoration:none;border:1px solid transparent;padding:3px 8px;background:none;color:var(--fg);cursor:pointer}
nav a{color:var(--mut)}
nav a.on,nav a:hover{color:var(--fg)}
nav .btn{color:var(--mut);border:0}
nav .btn:hover{background:none;color:var(--mut);border:0}
footer .wrap{display:flex;align-items:center;gap:8px}
#adm{border:0;background:none;color:var(--mut);padding:0;font:inherit;cursor:default}
.btn{border-color:var(--line)}
.btn:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:disabled{opacity:.4;pointer-events:none}
main{padding:24px 0 56px;min-height:70vh}
h1{font-size:22px;font-weight:800;margin:0 0 2px}
.sub{color:var(--mut);font:500 11px/1.5 var(--sans);margin:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{display:block;border:1px solid var(--line);text-decoration:none}
.card:hover{border-color:var(--fg)}
.ph{aspect-ratio:3/4;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:var(--mut);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:8px 10px;border-top:2px solid var(--fg)}
.card b{display:block;font-size:13px;font-weight:800}
.card span{color:var(--mut);font-size:11px;font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;align-items:center}
.chip{font:600 11px/1.5 var(--sans);border:1px solid var(--line);background:none;color:var(--mut);padding:2px 9px;cursor:pointer}
.chip:hover{color:var(--fg);border-color:var(--fg)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 10px;font:13px/1.5 var(--sans);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
#q{margin-bottom:10px}
textarea.m{font-family:var(--mono);font-size:12px}
.pr{border:1px solid var(--line);border-left:3px solid var(--fg);margin-bottom:10px;display:flex}
.pr .im{width:96px;flex:none;border-right:1px solid var(--line);background:var(--soft)}
.pr .im img{width:100%;height:100%;object-fit:cover;display:block}
.pr .bd{flex:1;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);font:700 11px/1.5 var(--sans);gap:8px}
.hd .btn{padding:0 7px;font-size:10.5px}
.hd div{display:flex;gap:4px}
.tx{padding:10px 12px;margin:0;font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.more{display:block;margin:16px auto 0}
.back{display:inline-block;margin-bottom:14px;font:600 11px/1.5 var(--sans);color:var(--mut);text-decoration:none}
.back:hover{color:var(--fg)}
.prof{display:grid;grid-template-columns:300px 1fr;gap:24px;margin-bottom:24px}
.prof .ph{border:1px solid var(--line);border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin:10px 0 14px;border-top:2px solid var(--fg)}
th,td{text-align:left;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;vertical-align:top}
th{width:72px;color:var(--mut);font:500 11px/1.5 var(--sans);padding-top:6px}
h2{font:800 12px/1.5 var(--sans);margin:26px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--fg)}
.empty{color:var(--mut);padding:32px 0;text-align:center}
.acts{display:flex;gap:5px;margin-top:12px}
footer{border-top:1px solid var(--line);padding:14px 0;color:var(--mut);font:500 11px/1.5 var(--sans)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px 20px;z-index:20}
#md[hidden]{display:none}
.mb{background:var(--bg);border:1px solid var(--line);max-width:520px;margin:0 auto;padding:16px}
.mb h3{margin:0 0 4px;font-size:15px;font-weight:800}
.mb label{display:block;font:600 11px/1.5 var(--sans);color:var(--mut);margin:12px 0 4px}
.mb .row{display:flex;gap:5px;margin-top:16px}
.mb .row .btn{padding:5px 14px}
.mb .row .btn.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.sr{border:1px solid var(--line);padding:8px;margin-top:6px;display:grid;gap:5px}
.sr .btn{justify-self:end}
.st{color:var(--mut);font-size:12px;margin-top:8px;min-height:18px;white-space:pre-wrap}
.cur{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px}
.cur img{width:40px;height:54px;object-fit:cover;border:1px solid var(--line)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.gal div{aspect-ratio:3/4;border:1px solid var(--line);overflow:hidden;cursor:zoom-in}
.gal div:hover{border-color:var(--fg)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gedit{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mb .gi{margin:0;font-weight:500}
.gi img{width:56px;height:74px;object-fit:cover;border:1px solid var(--line);display:block}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:30;cursor:zoom-out;padding:16px}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
@media(max-width:640px){.prof{grid-template-columns:1fr}.prof .ph{max-width:300px}.pr{flex-direction:column}.pr .im{width:100%;height:160px;border-right:0;border-bottom:1px solid var(--line)}}
.h2s{display:flex;justify-content:space-between;align-items:center}
.vs{display:flex;gap:3px}.vs .chip{padding:0 8px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0}
.tg{font:600 11px/1.5 var(--sans);border:1px solid var(--fg);padding:0 8px}
.sp{border:1px solid var(--line);border-left:3px solid var(--fg);margin-bottom:10px}
.sp .tt{display:flex;align-items:center;gap:7px;min-width:0}
.sp .th{display:none}
.sp .sim{display:none;background:var(--soft);overflow:hidden;cursor:zoom-in}
.sp .sim img,.sp .th img{width:100%;height:100%;object-fit:cover;display:block}
.sp .bd{min-width:0}
/* A: 왼쪽 썸네일 */
[data-v=a] .sp{display:flex}
[data-v=a] .sp .sim:not(.no){display:block;width:96px;min-height:96px;flex:none;border-right:1px solid var(--line)}
[data-v=a] .sp .bd{flex:1}
/* B: 제목 옆 미니 썸네일 */
[data-v=b] .sp .th{display:block;width:28px;height:38px;flex:none;border:1px solid var(--line);overflow:hidden;cursor:zoom-in}
[data-v=b] .sp .hd{padding:6px 10px}
/* C: 카드 그리드 */
[data-v=c]{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
[data-v=c] .sp{margin:0;border-left:1px solid var(--line);display:flex;flex-direction:column}
[data-v=c] .sp .sim{display:flex;aspect-ratio:4/3;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--mut);border-bottom:2px solid var(--fg)}
[data-v=c] .sp .bd{flex:1}
[data-v=c] .sp .tx{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
[data-v=c] .sp .tx.open{display:block}
@media(max-width:640px){[data-v=a] .sp{flex-direction:column}[data-v=a] .sp .sim:not(.no){width:100%;height:160px;border-right:0;border-bottom:1px solid var(--line)}}
.card{position:relative}
.pin{position:absolute;top:6px;right:6px;z-index:1;font:600 9px/1.5 var(--sans);padding:1px 6px;background:var(--bg);color:var(--mut);border:1px solid var(--line);cursor:pointer}
.pin:hover{color:var(--fg);border-color:var(--fg)}
.pin.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#/characters">r♡sie <span class="lg2">prompt</span></a>
  <nav>
    <a href="#/characters" id="n1">persona</a>
    <a href="#/prompts" id="n2">prompt</a>
    <button class="btn" id="theme" title="테마">◐</button>
  </nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap"><button id="adm">✦</button>PERSONAL ARCHIVE · NO REDISTRIBUTION</div></footer>
<div id="lb" hidden></div>
<div id="md" hidden><div class="mb" id="mb"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://sxnijnngeatcscwyxhep.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4bmlqbm5nZWF0Y3Njd3l4aGVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NjE0MjIsImV4cCI6MjEwNzAzNzQyMn0.zT-jmsg7M14H7BFnqWFSclc6wnANJNDnHiVuCY9SoI8";
const BUCKET = "images";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(3, '0');
const img = (src, alt) => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">` : '';
const initial = n => esc([...n][0] || '?');
let CH = [], PR = [], admin = false, dirty = false;
let SV = 'a'; try{ SV = localStorage.getItem('sv') || 'a'; }catch(_){} if(!'abc'.includes(SV)) SV = 'a';
const tagsOf = s => String(s ?? '').split(/[,，#]+/).map(x => x.trim()).filter(Boolean);
function subBox(c, x, i, pre='s'){
  const t = x.t || 'SUB ' + (i+1), z = x.img ? ` data-act="zoom" data-src="${esc(x.img)}"` : '';
  return `<div class="sp"><div class="sim${x.img ? '' : ' no'}"${z}>${x.img ? img(x.img,t) : initial(t)}</div>
  <div class="bd"><div class="hd"><span class="tt">${x.img ? `<span class="th"${z}>${img(x.img,t)}</span>` : ''}<span>${esc(t)}</span></span><button class="btn" data-act="copy" data-k="${pre}${c.id}-${i}">COPY</button></div>
  <pre class="tx" data-act="expand">${esc(x.x)}</pre></div></div>`;
}

/* ---------- data ---------- */
async function load(){
  const [c, p] = await Promise.all([sb.from('characters').select('*').order('id'), sb.from('prompts').select('*').order('id')]);
  if(c.error || p.error){ app.innerHTML = `<p class="empty">불러오기 실패<br>${esc((c.error||p.error).message)}</p>`; return false; }
  CH = c.data; PR = p.data; return true;
}
const textOf = k => {
  if(k[0]==='q'){ const [i,j] = k.slice(1).split('-'); const p = PR.find(p => p.id===+i); return ((p && p.subs || [])[+j] || {}).x; }
  if(k[0]==='s'){ const [i,j] = k.slice(1).split('-'); const c = CH.find(c => c.id===+i); return ((c && c.subs || [])[+j] || {}).x; }
  return k[0]==='p' ? (PR.find(p => p.id===+k.slice(1))||{}).text : (CH.find(c => c.id===+k.slice(1))||{}).prompt;
};
const num = p => PR.findIndex(x => x.id===p.id) + 1;
const chName = id => (CH.find(c => c.id===id)||{}).name;

/* ---------- views ---------- */
function promptBox(p){
  const cn = p.char_id ? chName(p.char_id) : '';
  return `<div class="pr">${p.img ? `<div class="im">${img(p.img,'')}</div>` : ''}
  <div class="bd"><div class="hd"><span>#${pad(num(p))} · ${esc(p.cat)}${cn ? ' · ' + esc(cn) : ''}</span>
  <div>${admin ? `<button class="btn" data-act="edit-p" data-id="${p.id}">EDIT</button><button class="btn" data-act="del-p" data-id="${p.id}">DEL</button>` : ''}<button class="btn" data-act="copy" data-k="p${p.id}">COPY</button></div></div>
  <pre class="tx">${esc(p.text)}</pre>${(p.subs||[]).length ? `<div class="sps" data-v="${SV}" style="padding:4px 10px 0">${p.subs.map((x,i) => subBox(p,x,i,'q')).join('')}</div>` : ''}</div></div>`;
}

function pageChars(){
  app.innerHTML = `<div class="top"><div><h1>PERSONA</h1><p class="sub">CHARACTERS · ${CH.length}</p></div>
  ${admin ? '<button class="btn" data-act="new-c">+ NEW</button>' : ''}</div>
  ${CH.length ? `<div class="grid">${[...CH].sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0)).map(c => `<a class="card" href="#/c/${c.id}">${admin ? `<span class="pin ${c.pinned ? 'on' : ''}" data-act="pin" data-id="${c.id}">PIN</span>` : ''}
    <div class="ph">${c.img ? img(c.img,c.name) : initial(c.name)}</div>
    <div class="meta"><b>${esc(c.name)}</b><span>${esc(tagsOf(c.tag).join(' · '))}</span></div></a>`).join('')}</div>` : '<p class="empty">아직 캐릭터가 없어요.</p>'}`;
}

function pageChar(id){
  const c = CH.find(x => x.id===+id);
  if(!c){ app.innerHTML = '<p class="empty">캐릭터를 찾을 수 없어요.</p>'; return; }
  const rel = PR.filter(p => p.char_id===c.id).reverse();
  app.innerHTML = `<a class="back" href="#/characters">← BACK</a>
  <div class="prof">
    <div class="ph">${c.img ? img(c.img,c.name) : initial(c.name)}</div>
    <div><h1>${esc(c.name)}</h1>${tagsOf(c.tag).length ? `<div class="tags">${tagsOf(c.tag).map(t => `<span class="tg">${esc(t)}</span>`).join('')}</div>` : ''}
      <table>${(c.info||[]).map(([k,v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>
      <div style="white-space:pre-wrap">${esc(c.descr||'')}</div>
      ${admin ? `<div class="acts"><button class="btn" data-act="edit-c" data-id="${c.id}">EDIT</button><button class="btn" data-act="del-c" data-id="${c.id}">DELETE</button></div>` : ''}</div>
  </div>
  ${(c.gallery||[]).length ? `<h2>GALLERY · ${c.gallery.length}</h2><div class="gal">${c.gallery.map(u => `<div data-act="zoom" data-src="${esc(u)}">${img(u,'')}</div>`).join('')}</div>` : ''}
  ${c.prompt ? `<h2>CHARACTER PROMPT</h2><div class="pr"><div class="bd"><div class="hd"><span>BASE</span><button class="btn" data-act="copy" data-k="c${c.id}">COPY</button></div><pre class="tx">${esc(c.prompt)}</pre></div></div>` : ''}
  ${(c.subs||[]).length ? `<h2 class="h2s"><span>SUB PROMPTS</span><span class="vs">${['a','b','c'].map(v => `<button class="chip ${v===SV?'on':''}" data-act="subv" data-sv="${v}">${v.toUpperCase()}</button>`).join('')}</span></h2><div class="sps" id="sps" data-v="${SV}">${c.subs.map((x,i) => subBox(c,x,i)).join('')}</div>` : ''}
  ${rel.length ? `<h2>RELATED PROMPTS</h2>${rel.map(promptBox).join('')}` : ''}`;
}

let cat = 'all', q = '', shown = 20;
function pagePrompts(){
  const cats = [...new Set(PR.map(p => p.cat))];
  if(cat!=='all' && !cats.includes(cat)) cat = 'all';
  const cnt = k => k==='all' ? PR.length : PR.filter(p => p.cat===k).length;
  app.innerHTML = `<div class="top"><div><h1>PROMPT</h1><p class="sub">ARCHIVE · ${PR.length} SAVED</p></div>
  ${admin ? '<button class="btn" data-act="new-p">+ NEW</button>' : ''}</div>
  <input type="search" id="q" placeholder="검색" value="${esc(q)}">
  <div class="bar" id="chips">${['all',...cats].map(k => `<button class="chip ${k===cat?'on':''}" data-c="${esc(k)}">${esc(k)} ${cnt(k)}</button>`).join('')}</div>
  <div id="list"></div>`;
  $('#q').oninput = e => { q = e.target.value; shown = 20; list(); };
  $('#chips').onclick = e => { const b = e.target.closest('[data-c]'); if(!b) return; cat = b.dataset.c; shown = 20;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x===b)); list(); };
  list();
}
function list(){
  const s = q.trim().toLowerCase();
  const rows = PR.filter(p => (cat==='all'||p.cat===cat) && (!s || p.text.toLowerCase().includes(s))).reverse();
  $('#list').innerHTML = rows.length
    ? rows.slice(0,shown).map(promptBox).join('') + (rows.length>shown ? '<button class="btn more" id="more">MORE</button>' : '')
    : '<p class="empty">결과가 없어요.</p>';
  const m = $('#more'); if(m) m.onclick = () => { shown += 20; list(); };
}

function route(){
  const [a,b] = (location.hash.slice(2) || 'characters').split('/');
  $('#n1').classList.toggle('on', a!=='prompts'); $('#n2').classList.toggle('on', a==='prompts');
  a==='prompts' ? pagePrompts() : a==='c' ? pageChar(b) : pageChars();
  window.scrollTo(0,0);
}

/* ---------- modal & forms ---------- */
const openM = h => { $('#mb').innerHTML = h; dirty = false; $('#md').hidden = false; };
const closeM = () => { $('#md').hidden = true; $('#mb').innerHTML = ''; };
$('#mb').addEventListener('input', () => { dirty = true; });
const st = t => { const s = $('#st'); if(s) s.textContent = t; };
const btns = label => `<div class="st" id="st"></div><div class="row"><button class="btn pri" type="submit" id="sv">${label}</button><button class="btn" type="button" data-act="close">CANCEL</button></div>`;

async function upload(file, dir){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*s); cv.height = Math.round(bmp.height*s);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/webp', .88));
  const path = `${dir}/${crypto.randomUUID()}.webp`;
  const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType:'image/webp', cacheControl:'31536000' });
  if(error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
const imgField = cur => `<label>이미지 ${cur ? '(새로 고르면 교체)' : '(선택)'}</label><input type="file" name="file" accept="image/*">
  ${cur ? `<div class="cur">${img(cur,'')}<label style="margin:0"><input type="checkbox" name="rmimg" style="width:auto"> 이미지 삭제</label></div>` : ''}`;

async function finish(fn){
  const b = $('#sv'); b.disabled = true; st('저장 중…');
  try{ await fn(); closeM(); await load(); route(); }
  catch(err){ st('오류: ' + (err.message || err)); b.disabled = false; }
}

async function readSubs(fd){
  const t = fd.getAll('sub_t'), x = fd.getAll('sub_x'), si = fd.getAll('sub_img'), sf = fd.getAll('sub_file'), subs = [];
  for(let i = 0; i < x.length; i++){
    const tx = (x[i]||'').trim(); if(!tx) continue;
    let sim = si[i] || '', file = sf[i];
    if(file && file.size){ st(`서브 이미지 업로드 중… ${i+1}/${x.length}`); sim = await upload(file, 'prompts'); }
    subs.push({ t: (t[i]||'').trim(), x: tx, img: sim });
  }
  return subs;
}
function formP(p){
  const cats = [...new Set(PR.map(x => x.cat))];
  openM(`<h3>${p ? '프롬프트 수정' : '프롬프트 추가'}</h3>
  <form id="f">
    <label>카테고리</label><input name="cat" list="cl" required value="${esc(p ? p.cat : (cat!=='all' ? cat : ''))}" placeholder="solo, duo, outfit …" autocomplete="off">
    <datalist id="cl">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <label>연결할 캐릭터 (선택)</label><select name="char_id"><option value="">없음</option>${CH.map(c => `<option value="${c.id}" ${p && p.char_id===c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    <label>프롬프트</label><textarea class="m" name="text" rows="9" required>${esc(p ? p.text : '')}</textarea>
    ${imgField(p && p.img)}
    <label>서브 프롬프트</label><div id="subs">${((p && p.subs) || []).map(subRow).join('')}</div>
    <button class="btn" type="button" data-act="add-sub" style="margin-top:6px">+ SUB</button>
    ${btns('SAVE')}
  </form>`);
  $('#f').onsubmit = e => { e.preventDefault(); const fd = new FormData(e.target);
    finish(async () => {
      let im = p ? p.img : '';
      if(fd.get('rmimg')) im = '';
      const f = fd.get('file'); if(f && f.size){ st('이미지 업로드 중…'); im = await upload(f, 'prompts'); }
      const row = { cat: fd.get('cat').trim(), text: fd.get('text').trim(), img: im, char_id: fd.get('char_id') ? +fd.get('char_id') : null, subs: await readSubs(fd) };
      const r = p ? await sb.from('prompts').update(row).eq('id', p.id) : await sb.from('prompts').insert(row);
      if(r.error) throw r.error;
    }); };
}

const parseInfo = t => t.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
  const m = l.match(/^([^:：]+)[:：]\s*(.*)$/); return m ? [m[1].trim(), m[2].trim()] : [l, ''];
}).filter(([k,v]) => k && v);

const FIX = [['성별',['성별']], ['나이',['나이','Age','age','AGE']], ['키',['키']], ['DOB',['DOB','생일']], ['국적',['국적']]];
const subRow = (x={}) => `<div class="sr"><input name="sub_t" placeholder="서브 프롬프트 이름" value="${esc(x.t)}"><textarea class="m" name="sub_x" rows="3">${esc(x.x)}</textarea>
  <input type="hidden" name="sub_img" value="${esc(x.img)}">
  <label style="margin:2px 0 0">이미지 ${x.img ? '(새로 고르면 교체)' : '(선택)'}</label><input type="file" name="sub_file" accept="image/*">
  ${x.img ? `<div class="cur">${img(x.img,'')}<button class="btn" type="button" data-act="rm-sub-img">이미지 삭제</button></div>` : ''}
  <button class="btn" type="button" data-act="del-sub">REMOVE</button></div>`;

function formC(c){
  const inf = c ? (c.info||[]) : [];
  const get = ks => (inf.find(([k]) => ks.includes(k))||[])[1] || '';
  const used = FIX.flatMap(([,ks]) => ks);
  const extra = c ? inf.filter(([k]) => !used.includes(k)).map(([k,v]) => `${k}: ${v}`).join('\n') : '';
  openM(`<h3>${c ? '캐릭터 수정' : '캐릭터 추가'}</h3>
  <form id="f">
    <div class="g2">
      <div><label>이름</label><input name="name" required value="${esc(c ? c.name : '')}"></div>
      <div><label>태그 (쉼표로 구분: 주인공, 조연 …)</label><input name="tag" value="${esc(c ? c.tag : '')}"></div>
      ${FIX.map(([k,ks],i) => `<div><label>${k}</label><input name="fx${i}" value="${esc(get(ks))}" ${k==='DOB' ? 'placeholder="YYYY-MM-DD"' : ''}></div>`).join('')}
    </div>
    ${imgField(c && c.img)}
    <label>갤러리 (여러 장 선택 가능)</label><input type="file" name="gfiles" accept="image/*" multiple>
    ${((c && c.gallery) || []).length ? `<div class="gedit">${c.gallery.map((u,i) => `<label class="gi">${img(u,'')}<input type="checkbox" name="grm" value="${i}" style="width:auto"> 삭제</label>`).join('')}</div>` : ''}
    <label>추가 프로필 정보 — 한 줄에 "항목: 값" (값이 비면 표시 안 됨)</label><textarea name="info" rows="4">${esc(extra)}</textarea>
    <label>설명</label><textarea name="descr" rows="4">${esc(c ? c.descr : '')}</textarea>
    <label>캐릭터 기본 프롬프트</label><textarea class="m" name="prompt" rows="4">${esc(c ? c.prompt : '')}</textarea>
    <label>서브 프롬프트</label><div id="subs">${((c && c.subs) || []).map(subRow).join('')}</div>
    <button class="btn" type="button" data-act="add-sub" style="margin-top:6px">+ SUB</button>
    ${btns('SAVE')}
  </form>`);
  $('#f').onsubmit = e => { e.preventDefault(); const fd = new FormData(e.target);
    finish(async () => {
      let im = c ? c.img : '';
      if(fd.get('rmimg')) im = '';
      const f = fd.get('file'); if(f && f.size){ st('이미지 업로드 중…'); im = await upload(f, 'characters'); }
      const fixed = FIX.map(([k],i) => [k, (fd.get('fx'+i)||'').trim()]).filter(([,v]) => v);
      const rm = fd.getAll('grm'), gallery = ((c && c.gallery) || []).filter((_,i) => !rm.includes(String(i)));
      const gf = fd.getAll('gfiles').filter(x => x && x.size);
      for(let i = 0; i < gf.length; i++){ st(`갤러리 업로드 중… ${i+1}/${gf.length}`); gallery.push(await upload(gf[i], 'characters')); }
      const subs = await readSubs(fd);
      const row = { name: fd.get('name').trim(), tag: fd.get('tag').trim(), img: im, info: [...fixed, ...parseInfo(fd.get('info'))], descr: fd.get('descr').trim(), prompt: fd.get('prompt').trim(), subs, gallery };
      const r = c ? await sb.from('characters').update(row).eq('id', c.id) : await sb.from('characters').insert(row);
      if(r.error) throw r.error;
    }); };
}

function formLogin(){
  openM(`<h3>ADMIN LOGIN</h3><form id="f">
    <label>이메일</label><input type="email" name="email" required autocomplete="username">
    <label>비밀번호</label><input type="password" name="pw" required autocomplete="current-password">
    ${btns('LOGIN')}</form>`);
  $('#f').onsubmit = async e => { e.preventDefault(); const fd = new FormData(e.target); st('로그인 중…');
    const { error } = await sb.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('pw') });
    if(error) return st('로그인 실패: ' + error.message);
    closeM(); route(); };
}

async function del(table, id, label){
  if(!confirm(`이 ${label}를 삭제할까요?`)) return false;
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error){ alert('삭제 실패: ' + error.message); return false; }
  await load(); return true;
}

/* ---------- events ---------- */
function copy(b){
  const t = textOf(b.dataset.k) || '', o = b.textContent;
  const done = () => { b.textContent = 'COPIED'; setTimeout(() => b.textContent = o, 1200); };
  const fb = () => { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); }catch(_){} a.remove(); done(); };
  (navigator.clipboard && window.isSecureContext) ? navigator.clipboard.writeText(t).then(done, fb) : fb();
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = +b.dataset.id || null;
  if(a==='pin'){ e.preventDefault(); const c = CH.find(x => x.id===id); const r = await sb.from('characters').update({ pinned: !c.pinned }).eq('id', id); if(r.error) return alert('핀 실패: ' + r.error.message); await load(); return pageChars(); }
  if(a==='copy') return copy(b);
  if(a==='close') return closeM();
  if(a==='zoom'){ const l = $('#lb'); l.innerHTML = `<img src="${esc(b.dataset.src)}">`; l.hidden = false; return; }
  if(a==='add-sub') return $('#subs').insertAdjacentHTML('beforeend', subRow());
  if(a==='del-sub') return b.closest('.sr').remove();
  if(a==='rm-sub-img'){ const r = b.closest('.sr'); r.querySelector('[name=sub_img]').value = ''; const cu = r.querySelector('.cur'); if(cu) cu.remove(); return; }
  if(a==='subv'){ SV = b.dataset.sv; try{ localStorage.setItem('sv', SV); }catch(_){} const sp = $('#sps'); if(sp) sp.dataset.v = SV; document.querySelectorAll('[data-act=subv]').forEach(x => x.classList.toggle('on', x===b)); return; }
  if(a==='expand'){ b.classList.toggle('open'); return; }
  if(a==='new-p') return formP();
  if(a==='edit-p') return formP(PR.find(p => p.id===id));
  if(a==='del-p') { if(await del('prompts', id, '프롬프트')) route(); return; }
  if(a==='new-c') return formC();
  if(a==='edit-c') return formC(CH.find(c => c.id===id));
  if(a==='del-c') { if(await del('characters', id, '캐릭터')) location.hash==='#/characters' ? route() : location.hash = '#/characters'; }
});
$('#lb').onclick = () => { $('#lb').hidden = true; };
addEventListener('keydown', e => { if(e.key==='Escape'){ if(!$('#lb').hidden){ $('#lb').hidden = true; return; } if(!$('#md').hidden && (!dirty || confirm('입력한 내용이 사라져요. 닫을까요?'))) closeM(); } });
$('#theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
};
const syncAdm = () => $('#adm').textContent = admin ? '✧' : '✦';
$('#adm').onclick = async () => { if(admin){ await sb.auth.signOut(); route(); } else formLogin(); };
sb.auth.onAuthStateChange((_ev, s) => { const was = admin; admin = !!s; syncAdm(); if(was !== admin && (CH.length || PR.length)) route(); });
addEventListener('hashchange', route);

(async () => {
  app.innerHTML = '<p class="empty">LOADING…</p>';
  const { data } = await sb.auth.getSession(); admin = !!data.session; syncAdm();
  if(await load()) route();
})();
</script>
</body>
